# ============================================================
# API GATEWAY - Configuración principal
# ============================================================
# El Gateway será la puerta de entrada única del sistema Hilton.
# Corre en el puerto 9000 y redirige peticiones hacia los microservicios
# registrados en Eureka usando lb://nombre-del-servicio.
# ============================================================

server:
  port: 9000
  error:
    include-stacktrace: never

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Permite descubrir servicios registrados en Eureka.
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # [GATEWAY-INI]
      # Rutas principales hacia los microservicios del sistema Hilton.
      routes:
        - id: ms-autenticacion
          uri: lb://ms-autenticacion
          predicates:
            - Path=/api/v1/auth/**,/api/v1/sesiones/**

        - id: ms-habitaciones
          uri: lb://ms-habitaciones
          predicates:
            - Path=/api/v1/habitaciones/**,/api/v1/tipos-habitacion/**,/api/v1/estados/**

        - id: ms-reservas
          uri: lb://ms-reservas
          predicates:
            - Path=/api/v1/reservas/**,/api/v1/disponibilidad/**,/api/v1/cancelaciones/**

        - id: ms-huespedes
          uri: lb://ms-huespedes
          predicates:
            - Path=/api/v1/huespedes/**,/api/v1/documentos/**,/api/v1/preferencias/**

        - id: ms-checkin
          uri: lb://ms-checkin
          predicates:
            - Path=/api/v1/checkins/**,/api/v1/checkin/**,/api/v1/checkouts/**,/api/v1/checkout/**,/api/v1/llaves/**

        - id: ms-pagos
          uri: lb://ms-pagos
          predicates:
            - Path=/api/v1/pagos/**,/api/v1/cargos/**,/api/v1/facturas/**

        - id: ms-housekeeping
          uri: lb://ms-housekeeping
          predicates:
            - Path=/api/v1/tareas/**,/api/v1/asignaciones/**,/api/v1/proj-habitaciones/**

        - id: ms-restaurante
          uri: lb://ms-restaurante
          predicates:
            - Path=/api/v1/mesas/**,/api/v1/pedidos/**,/api/v1/items-pedido/**

        - id: ms-inventario
          uri: lb://ms-inventario
          predicates:
            - Path=/api/v1/productos/**,/api/v1/movimientos/**,/api/v1/minibares/**,/api/v1/mini-bares/**

        - id: ms-notificaciones
          uri: lb://ms-notificaciones
          predicates:
            - Path=/api/v1/notificaciones/**,/api/v1/plantillas/**,/api/v1/envios/**

        - id: ms-tarifas
          uri: lb://ms-tarifas
          predicates:
            - Path=/api/v1/tarifas/**,/api/v1/temporadas/**,/api/v1/descuentos/**

        - id: ms-reportes
          uri: lb://ms-reportes
          predicates:
            - Path=/api/v1/reportes/**,/api/v1/metricas/**,/api/v1/kpis/**
      # [GATEWAY-FIN]

# Actuator: monitoreo y salud del Gateway
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "API Gateway para microservicios Hilton"

# Eureka: permite que el Gateway descubra los microservicios registrados
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${random.value}"
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 60
